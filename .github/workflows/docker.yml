name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# backuparr-1 and backuparr-2 are two runner instances on one VM, shared with lab2,
# tac and greatlakes-dag. Do not let a branch stack three-image builds on it.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  WEB_IMAGE_NAME: ${{ github.repository_owner }}/backuparr-web
  SIDECAR_IMAGE_NAME: ${{ github.repository_owner }}/backuparr-sidecar

jobs:
  test:
    # Self-hosted homelab runner for anything a collaborator triggered; a fork's pull
    # request falls back to ubuntu-latest. This repository is PUBLIC, and a self-hosted
    # runner is code execution on a VM that sits on the LAN alongside the Proxmox API,
    # the UDM and the k3s API server.
    #
    # This expression is the second of two controls and cannot stand alone: for a
    # `pull_request` event GitHub runs the workflow file from the merge of base and
    # head, so a fork PR can delete this very line. The control that a fork cannot
    # edit is the repository setting Settings -> Actions -> General -> "Fork pull
    # request workflows from outside collaborators" = "Require approval for all
    # outside collaborators". It must stay enabled. See the `runner_instances`
    # comment in mcfitz2/lab2 components/github-runner/01_tf_provision/variables.tf.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","go"]' || '["ubuntu-latest"]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check formatting
        run: gofmt -l . | tee /dev/stderr | (! read -r)

  build-and-push:
    needs: test
    # Same expression, same reasoning as the `test` job above.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","go"]' || '["ubuntu-latest"]') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Not preinstalled on the self-hosted runner the way it is on ubuntu-latest,
      # and docker/build-push-action requires it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Extract sidecar metadata
        id: meta_sidecar
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.SIDECAR_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push sidecar image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sidecar
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_sidecar.outputs.tags }}
          labels: ${{ steps.meta_sidecar.outputs.labels }}

      - name: Extract web metadata
        id: meta_web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.WEB_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta_web.outputs.tags }}
          labels: ${{ steps.meta_web.outputs.labels }}
